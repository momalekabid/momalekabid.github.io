<style>
  .porch { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin: 48px 0 0 auto; width: max-content; color: inherit; opacity: .75; text-decoration: none; transition: opacity .2s; }
  .porch:hover { opacity: 1; }
  .porch-art { display: block; image-rendering: pixelated; }
  .porch-lamp { fill: currentColor; }
  .porch-glow { fill: #f5b942; display: none; }
  .porch.lit { opacity: 1; }
  .porch.lit .porch-lamp { fill: #f5b942; }
  .porch.lit .porch-glow { display: inline; }
  .porch-note { font-size: 12px; }
</style>
<script>
  // light the porch lamp when someone's actually around to chat
  (function () {
    var relay = '{{ site.chat_relay }}';
    if (!relay || !window.fetch) return;
    var ctrl = window.AbortController ? new AbortController() : null;
    if (ctrl) setTimeout(function () { ctrl.abort(); }, 4000);
    fetch(relay.replace(/^ws/, 'http').replace(/\/$/, '') + '/status', ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.keepers > 0) {
          document.getElementById('porch').classList.add('lit');
          document.getElementById('porch-note').textContent = "light's on, come say hi";
        }
      })
      .catch(function () {});
  })();
</script>

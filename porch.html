---
layout: null
permalink: /porch/
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>porch</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; --dim: #888888; --lamp: #f5b942; --anon: #9a5f88; --keeper: #26876f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #eeeeee; --dim: #777777; --anon: #c39bb7; --keeper: #5fbfa6; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: monospace; font-size: 14px; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  .home { align-self: flex-start; color: var(--dim); text-decoration: none; font-size: 18px; }
  .chat { width: min(480px, 100%); margin-top: 32px; }
  .top { display: flex; justify-content: space-between; align-items: center; height: 24px; }
  .dot { width: 10px; height: 10px; border: 2px solid var(--dim); }
  .dot.connecting { animation: blink 1s steps(2) infinite; }
  .dot.on { background: var(--lamp); border-color: var(--lamp); }
  @keyframes blink { 50% { opacity: 0; } }
  .icon { font: inherit; font-size: 18px; color: var(--dim); background: none; border: 0; padding: 0 2px; cursor: pointer; }
  .icon:hover { color: var(--fg); }
  .icon:disabled { visibility: hidden; }
  .log { height: min(60vh, 420px); overflow-y: auto; border-top: 1px solid var(--dim); border-bottom: 1px solid var(--dim); margin: 8px 0; padding: 8px 0; display: flex; flex-direction: column; gap: 6px; }
  .log p { margin: 0; max-width: 80%; overflow-wrap: anywhere; }
  .log .them { align-self: flex-start; }
  .log .me { align-self: flex-end; color: var(--dim); text-align: right; }
  .log .name { margin-right: .5em; }
  .log .them .name { color: var(--keeper); }
  .log .me .name { color: var(--anon); }
  .log hr { width: 100%; border: 0; border-top: 1px dashed var(--dim); margin: 6px 0; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--fg); padding: 6px 8px;
  }
  input:disabled, form button:disabled { opacity: .3; }
  input.shake { animation: shake .3s steps(4); }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  form button { font: inherit; font-size: 16px; color: var(--bg); background: var(--fg); border: 0; padding: 4px 14px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .dot.connecting, input.shake { animation: none; } }
</style>
</head>
<body>
<a class="home" href="/" aria-label="home">←</a>

<div class="chat">
  <div class="top">
    <span class="dot" id="dot" role="img" aria-label="status"></span>
    <button class="icon" id="next" aria-label="someone else" disabled>↻</button>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <form id="form">
    <input id="text" maxlength="400" autocomplete="off" aria-label="message" disabled>
    <button aria-label="send" disabled>→</button>
  </form>
</div>

<script>
  /* relay address comes from _config.yml, or ?relay=ws://localhost:7777 for testing */
  const RELAY = new URLSearchParams(location.search).get('relay') || '{{ site.chat_relay }}';

  const dot = document.getElementById('dot');
  const log = document.getElementById('log');
  const input = document.getElementById('text');
  const sendBtn = document.querySelector('form button');
  const nextBtn = document.getElementById('next');

  let ws = null, matched = false, retry = 2000, me = '', them = '';

  function line(text, who, name) {
    const p = document.createElement('p');
    p.className = who;
    if (name) {
      const n = document.createElement('span');
      n.className = 'name';
      n.textContent = name;
      p.appendChild(n);
    }
    p.appendChild(document.createTextNode(text));
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  function divider() {
    if (log.lastElementChild && log.lastElementChild.tagName !== 'HR') {
      log.appendChild(document.createElement('hr'));
      log.scrollTop = log.scrollHeight;
    }
  }

  function setState(state) {
    matched = state === 'on';
    dot.className = 'dot ' + state;
    input.disabled = sendBtn.disabled = nextBtn.disabled = !matched;
    if (matched) input.focus();
  }

  function shake() {
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
  }

  function connect() {
    if (!RELAY || RELAY.charAt(0) === '{') return setState('off');
    setState('connecting');
    try {
      ws = new WebSocket(RELAY.replace(/\/$/, '') + '/visitor');
    } catch (e) {
      return setState('off');
    }
    ws.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      switch (m.type) {
        case 'matched':
          retry = 2000;
          me = m.to || me;
          them = m.keeper || them;
          setState('on');
          break;
        case 'empty':
          setState('off');
          break;
        case 'msg':
          line(m.text, 'them', m.from || them);
          break;
        case 'gone':
          divider();
          setState('connecting');
          break;
        case 'banned':
          retry = Infinity;
          setState('off');
          break;
        case 'error':
          shake();
          break;
      }
    };
    ws.onclose = () => {
      if (matched) divider();
      setState('off');
      if (retry !== Infinity) {
        setTimeout(connect, retry);
        retry = Math.min(retry * 2, 60000);
      }
    };
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !matched) return;
    send({ type: 'msg', text });
    line(text, 'me', me);
    input.value = '';
  });
  nextBtn.onclick = () => {
    if (!matched) return;
    divider();
    send({ type: 'reroll' });
  };

  connect();
</script>
</body>
</html>

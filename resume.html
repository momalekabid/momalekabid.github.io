<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resume</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #eeeeee; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; }
  a { color: inherit; }
  canvas { width: min(90vw, 67vh); image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  p { margin: 1rem 0 0; }
</style>
</head>
<body>
<a href="https://permacomputing.net/" target="_blank" rel="noopener" aria-label="permacomputing.net">
  <canvas id="flower" width="160" height="180"></canvas>
</a>
<p><a href="https://permacomputing.net/" target="_blank" rel="noopener">permacomputing.net</a></p>
<script>
  // draw at low res, then snap every pixel to on/off for a 1-bit look
  const c = document.getElementById('flower');
  const ctx = c.getContext('2d');
  const petal = new Path2D('M0 0 Q24 -34 0 -60 Q-24 -34 0 0Z');

  function draw() {
    const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.translate(80.5, 70.5);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#000';
    for (let i = 0; i < 8; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI / 4);
      ctx.stroke(petal);
      ctx.restore();
    }
    ctx.stroke(new Path2D('M0 60 V100'));
    ctx.stroke(new Path2D('M0 74 Q-28 56 -62 76 Q-30 94 0 74Z'));
    ctx.stroke(new Path2D('M0 74 L-54 76'));

    const img = ctx.getImageData(0, 0, c.width, c.height);
    const d = img.data;
    const r = parseInt(fg.slice(1, 3), 16), g = parseInt(fg.slice(3, 5), 16), b = parseInt(fg.slice(5, 7), 16);
    for (let i = 0; i < d.length; i += 4) {
      const on = d[i + 3] > 128;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = on ? 255 : 0;
    }
    ctx.putImageData(img, 0, 0);
  }

  draw();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
</script>
</body>
</html>

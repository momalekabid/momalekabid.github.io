<style>
  .porch { display: block; margin: 48px 0 0 auto; width: max-content; color: inherit; opacity: .75; transition: opacity .2s; }
  .porch:hover, .porch.lit { opacity: 1; }
  .porch-art { display: block; }
  .porch-lamp { fill: currentColor; }
  .porch-glow, .porch-person { display: none; }
  .porch-glow { fill: #f5b942; }
  .porch.lit .porch-lamp { fill: #f5b942; }
  .porch.lit .porch-glow, .porch.lit .porch-person { display: inline; }
  .porch-bubble { fill: currentColor; opacity: 0; animation: porch-think 3s steps(6) infinite; }
  @keyframes porch-think {
    0% { opacity: 0; translate: 0 0; }
    15% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; translate: 2px -7px; }
  }
  @media (prefers-reduced-motion: reduce) { .porch-bubble { animation: none; opacity: 1; } }
</style>
<script>
  /* someone's on the porch when the relay says a keeper is online */
  (function () {
    var relay = '{{ site.chat_relay }}';
    if (!relay || !window.fetch) return;
    var ctrl = window.AbortController ? new AbortController() : null;
    if (ctrl) setTimeout(function () { ctrl.abort(); }, 4000);
    fetch(relay.replace(/^ws/, 'http').replace(/\/$/, '') + '/status', ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (s) { if (s.keepers > 0) document.getElementById('porch').classList.add('lit'); })
      .catch(function () {});
  })();
</script>
